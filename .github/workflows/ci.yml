name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

  tests:
    name: Tests and reports
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Select test phase
        id: phase
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "mode=push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tests_count=$(jq '[.[] | select(. == "phase:tests")] | length' <<< "$PR_LABELS")
          fix_count=$(jq '[.[] | select(. == "phase:fix")] | length' <<< "$PR_LABELS")

          if [[ $((tests_count + fix_count)) -ne 1 ]]; then
            echo "::error::Apply exactly one of the phase:tests or phase:fix labels."
            exit 1
          fi

          if [[ "$tests_count" -eq 1 ]]; then
            echo "mode=tests" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fix" >> "$GITHUB_OUTPUT"
          fi

      - name: Run test suite
        shell: bash
        run: |
          case "${{ steps.phase.outputs.mode }}" in
            tests|push)
              mvn -B -Dmaven.test.failure.ignore=true test
              ;;
            fix)
              mvn -B test
              ;;
            *)
              echo "::error::No valid test phase was selected."
              exit 1
              ;;
          esac

      - name: Generate JaCoCo report after a failed test run
        if: ${{ always() && hashFiles('target/jacoco.exec') != '' }}
        continue-on-error: true
        run: mvn -B jacoco:report

      - name: Publish JUnit results
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('target/surefire-reports/*.xml') != '' }}
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/*.xml
          check_name: JUnit test results
          detailed_summary: true
          include_passed: true
          fail_on_failure: false

      - name: Comment JaCoCo coverage
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('target/site/jacoco/jacoco.xml') != '' }}
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: JaCoCo coverage report
          update-comment: true
